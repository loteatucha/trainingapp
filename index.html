<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Training</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a1628;
    --card: #142336;
    --surface-2: #1c2d48;
    --surface-3: #243a5b;
    --ink: #ffffff;
    --muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --accent: #60a5fa;
    --accent-strong: #3b82f6;
    --accent-soft: rgba(96, 165, 250, 0.18);
    --warn: #fbbf24;
    --done: #34d399;
    --skip: #f87171;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { padding: max(16px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(80px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); max-width: 720px; margin: 0 auto; min-height: 100vh; }

  /* Header */
  .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
  .topbar h1 { font-size: 24px; margin: 0; letter-spacing: -0.02em; font-weight: 700; }
  .topbar .sub { color: var(--muted); font-size: 13px; }
  .toolbar { display: flex; gap: 6px; }
  .btn { appearance: none; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--ink);
    padding: 7px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; transition: background .15s; }
  .btn:hover { background: var(--surface-3); }
  .btn.primary { background: var(--accent-strong); color: #fff; border-color: var(--accent-strong); }
  .btn.primary:hover { background: var(--accent); }
  .btn.ghost { background: transparent; border-color: var(--border); }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn.danger { color: var(--skip); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 14px; margin-bottom: 16px; }
  .tab { flex: 1; text-align: center; padding: 10px 6px; border-radius: 11px; font-weight: 600; font-size: 13px;
    color: var(--muted); cursor: pointer; user-select: none; transition: background .2s, color .2s; }
  .tab.active { background: var(--surface-3); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }

  /* Cards */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
  .card h2 { font-size: 17px; margin: 0 0 6px; letter-spacing: -0.01em; font-weight: 600; }
  .card h3 { font-size: 12px; margin: 12px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row + .row { margin-top: 6px; }
  .muted { color: var(--muted); font-size: 13px; }
  .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600; letter-spacing: 0.02em; }
  .pill.warn { background: rgba(251, 191, 36, 0.18); color: var(--warn); }
  .pill.skip { background: rgba(248, 113, 113, 0.18); color: var(--skip); }
  .pill.done { background: rgba(52, 211, 153, 0.18); color: var(--done); }

  /* Today header */
  .today-hero { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px;}
  .today-hero .lhs h2 { font-size: 20px; margin: 0; }
  .today-hero .lhs .date { color: var(--muted); font-size: 13px; }

  /* Progress */
  .progress-wrap { margin: 12px 0 16px; }
  .progress-track { background: var(--surface-2); height: 8px; border-radius: 999px; overflow: hidden; }
  .progress-fill { background: linear-gradient(90deg, var(--accent), var(--accent-strong)); height: 100%; transition: width .3s ease; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .progress-label .pct { font-weight: 700; color: var(--accent); }

  /* Exercise blocks */
  .block { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 14px; }
  .block:first-of-type { border-top: 0; padding-top: 0; margin-top: 8px; }
  .block-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 10px; display:flex; align-items:center; justify-content:space-between; }
  .ex { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  .ex.completed { background: rgba(52, 211, 153, 0.10); border-color: rgba(52, 211, 153, 0.30); }
  .ex.completed .ex-name { color: var(--done); }
  .ex-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ex-head-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .ex-check { width: 24px; height: 24px; flex: 0 0 24px; accent-color: var(--done); cursor: pointer; }
  .ex-name { font-weight: 600; font-size: 14px; }
  .ex-prescription { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .ex-note { font-size: 12px; color: var(--muted); margin-top: 4px; font-style: italic; }
  .ex-last { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--accent);
    background: var(--accent-soft); padding: 4px 10px; border-radius: 8px; margin-top: 8px;
    font-variant-numeric: tabular-nums; max-width: 100%; flex-wrap: wrap; }
  .ex-last .when { font-weight: 700; color: #fff; }
  .ex-last .sep { opacity: 0.5; }
  .last-session { background: var(--accent-soft); color: var(--ink); padding: 10px 14px; border-radius: 12px;
    font-size: 12px; margin: 0 0 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    font-variant-numeric: tabular-nums; border: 1px solid rgba(96, 165, 250, 0.25); }
  .last-session .when { font-weight: 700; color: var(--accent); }
  .last-session .sep { opacity: 0.4; }

  /* Compact warm-up row (Today) — check-off only, no reps/weight/RPE logging */
  .ex-lite { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 8px; cursor: pointer; transition: background .15s; }
  .ex-lite:hover, .ex-lite:active { background: var(--surface-2); }
  .ex-lite + .ex-lite { border-top: 1px solid var(--border); }
  .ex-lite .ex-check { pointer-events: none; flex: 0 0 auto; width: 22px; height: 22px; }
  .ex-lite-reps { flex: 0 0 auto; min-width: 46px; text-align: right; color: var(--accent); font-weight: 700;
    font-size: 13px; font-variant-numeric: tabular-nums; }
  .ex-lite-main { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ex-lite-name { font-size: 14px; font-weight: 500; color: var(--ink); }
  .ex-lite-note { font-size: 12px; color: var(--muted); font-style: italic; }
  .ex-lite.completed { opacity: 0.8; }
  .ex-lite.completed .ex-lite-name { color: var(--done); text-decoration: line-through; text-decoration-color: rgba(52,211,153,0.6); }

  /* Set rows — wheel picker triggers */
  .ex-sets { margin-top: 10px; display: grid; gap: 8px; }
  .set-row { display: grid; grid-template-columns: 28px 1fr 1fr 1fr; gap: 8px; align-items: stretch; }
  .set-row .set-num { font-size: 12px; color: var(--muted); font-weight: 700; text-align: center; display: flex; align-items: center; justify-content: center; }
  .set-cell { display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--surface-3); border: 1px solid var(--border); border-radius: 10px; padding: 6px 4px;
    cursor: pointer; transition: background .15s, border-color .15s, transform .08s; min-height: 48px; user-select: none; }
  .set-cell:hover { background: rgba(96, 165, 250, 0.10); border-color: var(--border-strong); }
  .set-cell:active { transform: scale(.96); }
  .set-cell .label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; line-height: 1; margin-bottom: 3px; font-weight: 600; }
  .set-cell .value { font-size: 19px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .set-cell .value.empty { color: var(--muted); font-weight: 400; font-size: 14px; }
  .set-cell .value.suggested { color: var(--accent); font-weight: 500; opacity: 0.7; font-style: italic; }

  .repeat-btn { display: flex; align-items: center; gap: 6px; background: var(--accent-soft);
    border: 1px dashed var(--accent); color: var(--accent); padding: 7px 12px; border-radius: 8px;
    font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background .15s;
    font-variant-numeric: tabular-nums; }
  .repeat-btn:hover, .repeat-btn:active { background: rgba(96, 165, 250, 0.25); }

  /* Yoga "class" card (Today view) */
  .class-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin: 4px 0 12px; text-align: center; }
  .class-card .class-title { font-size: 18px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .class-card .class-notes { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .class-card .class-hint { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }

  /* Per-exercise history sheet */
  .ex-name.tappable { cursor: pointer; }
  .ex-name.tappable:active { color: var(--accent); }
  .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 50vh; overflow-y: auto;
    padding: 4px 0; }
  .history-item { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; }
  .history-item .history-date { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  .history-item .history-date .when { color: var(--accent); }
  .history-item .history-sets { font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 500; }
  .history-item .history-rpe { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .history-empty { text-align: center; padding: 20px; color: var(--muted); font-size: 13px; }

  .add-set { background: none; border: 1px dashed var(--border-strong); color: var(--muted); padding: 9px;
    border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 600; transition: color .15s, border-color .15s; }
  .add-set:hover { color: var(--accent); border-color: var(--accent); }

  .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .input-grid label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .input-grid input, .full-input textarea, .full-input input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    font: inherit; font-size: 14px; background: var(--surface-2); color: var(--ink); }
  .input-grid input:focus, .full-input textarea:focus, .full-input input:focus { outline: none; border-color: var(--accent); }
  .full-input { margin-top: 10px; }
  .full-input textarea { resize: vertical; min-height: 70px; }
  textarea::placeholder, input::placeholder { color: var(--muted); opacity: 0.6; }

  /* Week view — vertical day rows (Trello-style) */
  .week-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .day-row { display: grid; grid-template-columns: 54px 1fr; gap: 12px;
    align-items: center; padding: 0; transition: transform .12s ease; }
  .day-row.swap-source .movable-content { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }

  .day-row .day-date { display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 4px 0; }
  .day-row .day-date .dow { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
  .day-row .day-date .dnum { font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; }
  .day-row.today .day-date .dnum { color: var(--accent); }

  /* Movable workout card — the thing that drags */
  .movable-content { display: grid; grid-template-columns: 1fr 36px; gap: 8px;
    align-items: center; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; cursor: pointer;
    transition: opacity .15s, transform .12s, background .15s, border-color .15s, box-shadow .15s; }
  .movable-content:hover { border-color: var(--border-strong); }
  .day-row.today .movable-content { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .day-row.completed .movable-content { background: rgba(52, 211, 153, 0.08); border-color: rgba(52, 211, 153, 0.25); }
  .day-row.skipped .movable-content { opacity: 0.55; }
  .movable-content.dragging-source { opacity: 0.25; transform: scale(.98); }
  .day-row.drag-over .movable-content { background: var(--accent-soft); border-color: var(--accent); transform: scale(1.015); }
  /* Settled days: past dimmed, today highlighted, locked rows show a lock */
  .day-row.past:not(.completed) .movable-content { opacity: 0.5; }
  .day-row.past .day-date .dnum { color: var(--muted); }
  .day-row.today .day-date .dow { color: var(--accent); }
  .day-lock { display: flex; align-items: center; justify-content: center;
    min-height: 44px; min-width: 36px; font-size: 13px; opacity: 0.55;
    filter: grayscale(1); user-select: none; }

  .day-row .day-workout { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .day-row .day-workout .icon { font-size: 28px; line-height: 1; flex: 0 0 auto; }
  .day-row .day-workout .info { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .day-row .day-workout .name { font-size: 15px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day-row .day-workout .sub { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .day-row .day-workout .sub.done { color: var(--done); font-weight: 600; }
  .day-row .day-workout .sub.skipped { color: var(--skip); font-weight: 600; }

  .day-row .drag-handle { display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 18px; cursor: grab; touch-action: none;
    user-select: none; min-height: 44px; min-width: 36px; border-radius: 8px;
    transition: color .15s, background .15s; font-weight: 700; letter-spacing: -2px; }
  .day-row .drag-handle:hover { color: var(--accent); background: var(--surface-3); }
  .day-row .drag-handle:active { cursor: grabbing; color: var(--accent); }

  .dragging-ghost { position: fixed; pointer-events: none; z-index: 2000;
    transform: rotate(1.5deg); box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    opacity: 0.95; left: 0; top: 0; background: var(--surface-2); border: 1px solid var(--accent);
    border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 1fr 36px; gap: 8px; align-items: center; }

  /* Wheel item — workout option style */
  .wheel-item .workout-line { display: inline-flex; align-items: baseline; gap: 8px; }
  .wheel-item .workout-line .emoji { font-size: 22px; }
  .wheel-item .workout-line .label { font-size: 16px; }
  .wheel-item.selected .workout-line .label { font-size: 19px; }

  /* Swap mode banner */
  .swap-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--accent-soft); border: 1px solid rgba(96, 165, 250, 0.4); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 12px; color: var(--ink); font-size: 14px; }
  .swap-banner strong { color: var(--accent); }

  /* Workout picker sheet rows */
  .sheet-list { display: flex; flex-direction: column; }
  .sheet-row { display: flex; align-items: center; gap: 14px; padding: 14px 10px;
    border-radius: 10px; cursor: pointer; transition: background .15s; border-bottom: 1px solid var(--border); }
  .sheet-row:last-of-type { border-bottom: none; }
  .sheet-row:hover, .sheet-row:active { background: var(--surface-2); }
  .sheet-row.selected { background: var(--accent-soft); }
  .sheet-row-icon { font-size: 22px; line-height: 1; flex: 0 0 auto; width: 28px; text-align: center; }
  .sheet-row-label { font-size: 15px; color: var(--ink); flex: 1; font-weight: 500; }
  .sheet-row-check { color: var(--accent); font-size: 16px; font-weight: 700; }
  .sheet-action { display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 8px; margin-top: 12px; border-radius: 12px; cursor: pointer;
    background: var(--surface-2); color: var(--accent); font-weight: 600; font-size: 14px;
    transition: background .15s; border: 1px solid var(--border); }
  .sheet-action:hover, .sheet-action:active { background: var(--surface-3); }

  /* Segmented control (for prescription picker) */
  .segmented { display: grid; grid-auto-columns: 1fr; grid-auto-flow: column; gap: 0;
    background: var(--surface-2); border-radius: 10px; padding: 3px; margin: 0 0 14px; }
  .segmented-opt { padding: 8px 12px; text-align: center; font-size: 13px; font-weight: 600;
    color: var(--muted); cursor: pointer; border-radius: 7px; transition: background .15s, color .15s; user-select: none; }
  .segmented-opt.active { background: var(--surface-3); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); }

  /* Multi-wheel layout */
  .wheels-row { display: grid; gap: 12px; }
  .wheels-row.cols-2 { grid-template-columns: 1fr 1fr; }
  .wheel-col { display: flex; flex-direction: column; }
  .wheel-col-label { text-align: center; font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.1em; font-weight: 600; margin-bottom: 6px; }

  /* Picker field — tap-to-open button used for run/swim/yoga inputs */
  .picker-field { width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--surface-2); color: var(--ink); font: inherit;
    font-size: 15px; font-weight: 600; text-align: center; cursor: pointer;
    transition: background .15s, border-color .15s; font-variant-numeric: tabular-nums;
    min-height: 44px; display: flex; align-items: center; justify-content: center; }
  .picker-field:hover, .picker-field:active { background: var(--surface-3); border-color: var(--border-strong); }
  .picker-field.empty { color: var(--muted); font-weight: 400; font-size: 18px; }
  .picker-field.readonly { cursor: default; color: var(--accent); }
  .picker-field.readonly:hover, .picker-field.readonly:active { background: var(--surface-2); border-color: var(--border); }
  .picker-field.readonly.empty { color: var(--muted); }

  /* Prescription button (in Plan editor) */
  .prescription-btn { display: flex; align-items: center; justify-content: center; gap: 4px;
    width: 100%; min-height: 40px; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: 8px;
    background: var(--surface-3); color: var(--accent); font: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: background .15s, border-color .15s; font-variant-numeric: tabular-nums;
    white-space: nowrap; }
  .prescription-btn:hover, .prescription-btn:active { background: var(--accent-soft); border-color: var(--accent); }
  .prescription-btn .empty { color: var(--muted); font-weight: 400; }

  /* Plan view */
  .schedule-row { display: grid; grid-template-columns: 90px 1fr; padding: 6px 0; border-bottom: 1px dashed var(--border); align-items: baseline; }
  .schedule-row .dow { font-weight: 700; color: var(--accent); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .schedule-row .what { font-size: 14px; }

  details { margin-top: 8px; }
  details > summary { cursor: pointer; padding: 8px 0; font-weight: 600; font-size: 14px; }
  details > summary.plan-day-summary { display: flex; align-items: center; gap: 10px; list-style: none; padding: 8px 4px; min-height: 48px; }
  details > summary.plan-day-summary::-webkit-details-marker { display: none; }
  details > summary.plan-day-summary::before { content: '▸'; color: var(--accent); font-size: 22px; line-height: 1; flex: 0 0 20px; text-align: center; transition: transform .15s ease; font-weight: 700; }
  details[open] > summary.plan-day-summary::before { transform: rotate(90deg); }
  details > summary.plan-day-summary .routine-name-input { flex: 1; font-size: 16px; }

  /* Plan editor */
  .plan-section-head { display: flex; justify-content: space-between; align-items: center; }

<script>
// ============================================================

const DEFAULT_GYM = [

//  STATE / STORAGE
// ============================================================

const STORAGE_KEY = 'cris-training-v2';
let state = loadState();

function loadState() {
  let s;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) s = JSON.parse(raw);
  } catch (e) {}
  if (!s) s = {};
  s.logs = s.logs || {};
  s.scheduleOverrides = s.scheduleOverrides || {};
  // Migrate older keys
  if (s.customStrength && !s.customGym) {
    s.customGym = s.customStrength;
    delete s.customStrength;
  }
  if (s.customRunning) delete s.customRunning;        // old week×day array — discarded
  if (s.runningWeek)   delete s.runningWeek;          // no longer used
  // Old yoga had blocks — migrate to simple { name, notes }
  if (s.customYoga && Array.isArray(s.customYoga.blocks)) {
    s.customYoga = { name: s.customYoga.name || DEFAULT_YOGA.name, notes: '' };
  }
  // Force-reset gym when DEFAULT_GYM structure has been bumped
  if (s.gymVersion !== GYM_VERSION) {
    s.customGym = null;
    s.gymVersion = GYM_VERSION;
  }
  s.customGym          = s.customGym          || null;
  s.customRunIntervals = s.customRunIntervals || null;
  s.customRunLong      = s.customRunLong      || null;
  s.customSwim         = s.customSwim         || null;
  s.customYoga         = s.customYoga         || null;
  // One-shot migration: legacy decimal duration/pace ("5.47") → MM:SS ("5:47")
  Object.values(s.logs || {}).forEach(log => {
    const f = log && log.workout && log.workout.fields;
    if (!f) return;
    ['duration', 'avgPace'].forEach(k => {
      const v = f[k];
      if (typeof v === 'string' && /^\d+\.\d{1,2}$/.test(v)) {

}
function saveState() {

}

function getGym()          { return state.customGym          || DEFAULT_GYM; }
function getRunIntervals() { return state.customRunIntervals || DEFAULT_RUN_INTERVALS; }
function getRunLong()      { return state.customRunLong      || DEFAULT_RUN_LONG; }
function getRunRoutine(variant) { return variant === 'long' ? getRunLong() : getRunIntervals(); }
function getSwim()         { return state.customSwim         || DEFAULT_SWIM; }
function getYoga()         { return state.customYoga         || DEFAULT_YOGA; }

function todayISO() {
  const d = new Date();
  const y = d.getFullYear(); const m = String(d.getMonth()+1).padStart(2,'0'); const da = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${da}`;
}
function dowFromISO(iso) {
  const d = new Date(iso + 'T12:00:00');
  const js = d.getDay(); // 0 = Sun
  return js === 0 ? 7 : js;
}
function startOfWeekISO(iso) {
  const dow = dowFromISO(iso);
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() - (dow - 1));
  return toISO(d);
}
function addDaysISO(iso, n) {
  const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate()+n);
  return toISO(d);
}
function toISO(d) {
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), da=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${da}`;
}
function getLog(iso) {
  if (!state.logs[iso]) state.logs[iso] = { workout: null, note: '' };
  return state.logs[iso];
}
function getEffectiveSchedule(iso) {
  const wk = startOfWeekISO(iso);
  const dow = dowFromISO(iso);
  const ov = state.scheduleOverrides[wk];
  if (ov && ov[dow]) return ov[dow];
  return DEFAULT_SCHEDULE[dow];
}
function setScheduleOverride(iso, workout) {
  const wk = startOfWeekISO(iso);
  const dow = dowFromISO(iso);
  if (!state.scheduleOverrides[wk]) state.scheduleOverrides[wk] = {};
  state.scheduleOverrides[wk][dow] = workout;
  saveState();
}
function resetWeekOverrides(iso) {
  const wk = startOfWeekISO(iso);
  delete state.scheduleOverrides[wk];
  saveState();
}

function renderToday(iso) {
  iso = iso || state.viewISO || todayISO();
  state.viewISO = iso;
  const isToday = iso === todayISO();
  const sched = getEffectiveSchedule(iso);
  const log = getLog(iso);

  const dateLabel = new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  document.getElementById('todayLabel').textContent =
    (isToday ? 'Today · ' : 'Viewing · ') + dateLabel;

  const root = document.getElementById('tab-today');
  root.innerHTML = '';

  const card = el('div', 'card');

  // Header
  const head = el('div', 'today-hero');
  const lhs = el('div', 'lhs');
  lhs.appendChild(el('h2', null, workoutLabel(sched)));
  lhs.appendChild(el('div', 'date', dateLabel + (isToday ? ' · TODAY' : '')));
  head.appendChild(lhs);

  const status = (log.workout && log.workout.status) || 'pending';
  head.appendChild(el('span', 'pill ' + (status==='done'?'done':status==='skipped'?'skip':'warn'),
    status==='done'?'Done':status==='skipped'?'Skipped':'Pending'));
  card.appendChild(head);

  // Progress bar (will fill in after body builds)
  const prog = el('div', 'progress-wrap');
  const track = el('div', 'progress-track');
  const fill = el('div', 'progress-fill'); fill.style.width = '0%';
  track.appendChild(fill);
  prog.appendChild(track);
  const plabel = el('div', 'progress-label');
  const plText = el('span', null, '');
  const pPct = el('span', 'pct', '0%');
  plabel.appendChild(plText); plabel.appendChild(pPct);
  prog.appendChild(plabel);
  card.appendChild(prog);

  // body
  const body = el('div');
  if (sched.type === 'gym') {
    renderGymBody(body, sched.dayIdx, iso, log, updateProgress);
  } else if (sched.type === 'run') {
    renderRunBody(body, sched.variant, iso, log, updateProgress);
  } else if (sched.type === 'swim') {
    renderSwimBody(body, iso, log, updateProgress);
  } else if (sched.type === 'yoga') {
    renderYogaBody(body, iso, log, updateProgress);
  } else if (sched.type === 'rest') {
    body.appendChild(el('div', 'muted', 'Rest day. Take care of yourself.'));
  }
  card.appendChild(body);

  // actions
  const actions = el('div', 'row'); actions.style.marginTop = '14px';
  const doneBtn = el('button', 'btn primary', '✓ Mark session done');
  const skipBtn = el('button', 'btn', 'Skip');
  doneBtn.addEventListener('click', () => {
    const w = ensureWorkout(log, sched);
    w.status = 'done';
    // Stamp a discrete entry. If already done, refresh the timestamp.
    if (!w.entryId) w.entryId = 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
    w.completedAt = new Date().toISOString();
    w.snapshot = buildEntrySnapshot(iso, sched, w);
    saveState(); renderToday(iso); toast('Entry logged ✓');
  });
  skipBtn.addEventListener('click', () => {
    const w = ensureWorkout(log, sched);
    w.status = 'skipped';
    w.completedAt = null;
    saveState(); renderToday(iso); toast('Marked skipped');
  });
  actions.appendChild(doneBtn);
  actions.appendChild(skipBtn);
  card.appendChild(actions);

  root.appendChild(card);

  updateProgress();

  function updateProgress() {
    const p = computeTodayProgress(sched, log);
    fill.style.width = p.pct + '%';
    pPct.textContent = p.pct + '%';
    plText.textContent = p.label;
  }
}

function computeTodayProgress(sched, log) {
  const w = log.workout;
  if (sched.type === 'run') {
    // Run is logged as a whole (no per-stage tracking) → progress follows done state
    const isDone = (w && w.status === 'done');
    return { pct: isDone ? 100 : 0, label: isDone ? 'Session complete' : 'Session pending' };
  }
  if (sched.type === 'gym' || sched.type === 'swim') {
    const routine = sched.type === 'gym' ? getGym()[sched.dayIdx] : getSwim();
    const exs = (routine && routine.blocks) ? routine.blocks.flatMap(b => b.exercises) : [];
    const total = exs.length;
    const done = w && w.completed ? Object.values(w.completed).filter(Boolean).length : 0;
    return { pct: total ? Math.round(done/total*100) : 0, label: `${done} of ${total} exercises complete` };
  }
  if (sched.type === 'yoga') {
    const isDone = (w && w.status === 'done');
    return { pct: isDone ? 100 : 0, label: isDone ? 'Session complete' : 'Session pending' };
  }
  if (sched.type === 'rest') return { pct: 100, label: 'Rest day' };
  return { pct: 0, label: '' };
}

function ensureWorkout(log, sched) {
  if (!log.workout) {
    log.workout = { type: sched.type, sets: {}, completed: {}, fields: {}, status: 'pending', notes: '' };
  } else if (sched && sched.type && log.workout.type !== sched.type) {
    // Schedule was swapped after the log was first created — keep type in sync
    log.workout.type = sched.type;
  }
  if (!log.workout.completed) log.workout.completed = {};
  if (!log.workout.sets) log.workout.sets = {};
  if (!log.workout.fields) log.workout.fields = {};
  return log.workout;
}

function isTimeBased(prescription) {
  return /\d+\s*s\b|\d+\s*"|\bsec/i.test(prescription || '');
}
function setsFromPrescription(p) {
  const m = String(p || '').match(/(\d+)\s*[×x]\s*/);
  return m ? parseInt(m[1]) : 1;
}

// "Last time" lookups — find the most recent prior log with data
function lastExerciseSession(exId, beforeISO) {
  let best = null;
  Object.entries(state.logs).forEach(([iso, log]) => {
    if (iso >= beforeISO) return;
    const sets = log.workout && log.workout.sets && log.workout.sets[exId];
    if (!sets || !sets.length) return;
    const populated = sets.filter(s => s.reps || s.kg || s.rpe);
    if (!populated.length) return;
    if (!best || iso > best.iso) best = { iso, sets: populated };
  });
  return best;
}
function lastTypeSession(type, beforeISO) {
  let best = null;
  Object.entries(state.logs).forEach(([iso, log]) => {
    if (iso >= beforeISO) return;
    const w = log.workout;
    if (!w || w.type !== type || w.status !== 'done') return;
    const f = w.fields || {};
    const hasData = Object.values(f).some(v => v);
    if (!hasData && !w.notes) return;
    if (!best || iso > best.iso) best = { iso, fields: f, notes: w.notes, label: w.snapshot && w.snapshot.workoutLabel };
  });
  return best;
}
function formatWhen(iso, refISO) {
  const a = new Date(iso + 'T12:00:00');
  const b = new Date(refISO + 'T12:00:00');
  const days = Math.round((b - a) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 7) return days + 'd ago';
  if (days < 14) return '1w ago';
  if (days < 56) return Math.round(days / 7) + 'w ago';
  return a.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function formatLastSets(sets, timeBased) {
  return sets.map(s => {
    const main = timeBased ? (s.reps ? s.reps + 's' : '—') : (s.reps || '—');
    const w = s.kg ? '·' + s.kg + 'kg' : '';
    return main + w;
  }).join(' | ');
}
function avgRpeOf(sets) {
  let sum = 0, n = 0;
  sets.forEach(s => { const v = parseFloat(s.rpe); if (!isNaN(v)) { sum += v; n++; } });
  return n ? sum / n : null;
}
function appendLastSession(container, last, iso, type) {
  const ls = el('div', 'last-session');
  ls.appendChild(el('span', 'when', 'Last ' + formatWhen(last.iso, iso)));
  if (type === 'run' && last.label) {
    ls.appendChild(el('span', 'sep', '·'));
    ls.appendChild(el('span', null, last.label.replace(/^Running · /, '')));
  }
  const f = last.fields || {};
  const parts = [];
  if (type === 'run') {
    if (f.distance) parts.push(f.distance + ' km');
    if (f.duration) parts.push(f.duration);
    if (f.avgPace) parts.push(f.avgPace + '/km');
    if (f.rpe) parts.push('RPE ' + f.rpe);
  } else if (type === 'swim') {
    if (f.distance) parts.push(f.distance + ' m');
    if (f.duration) parts.push(f.duration);
    if (f.intervals) parts.push(f.intervals);
    if (f.rpe) parts.push('RPE ' + f.rpe);
  } else if (type === 'yoga') {
    if (f.duration) parts.push(f.duration);
    if (f.rpe) parts.push('Felt ' + f.rpe);
  }
  parts.forEach(p => {
    ls.appendChild(el('span', 'sep', '·'));
    ls.appendChild(el('span', null, p));
  });
  container.appendChild(ls);
}

// Warm-up / prep blocks are checked off, not logged set-by-set (Mobility, Core, …)
function isWarmupBlock(block) {
  return /mobilit|core|warm|activation|stretch|cool[\s-]?down|prep/i.test((block && block.name) || '');
}

// Compact check-off row for warm-up exercises — tap anywhere to toggle complete
function buildLiteExRow(ex, w, onChange) {
  const completed = !!w.completed[ex.id];
  const row = el('div', 'ex-lite' + (completed ? ' completed' : ''));

  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.className = 'ex-check'; cb.checked = completed; cb.tabIndex = -1;
  row.appendChild(cb);

  if (ex.prescription) row.appendChild(el('div', 'ex-lite-reps', ex.prescription.replace(/\s*×\s*/g, '×')));

  const main = el('div', 'ex-lite-main');
  main.appendChild(el('span', 'ex-lite-name', ex.name));
  if (ex.note) main.appendChild(el('span', 'ex-lite-note', ex.note));
  row.appendChild(main);

  row.addEventListener('click', () => {
    const nv = !w.completed[ex.id];
    w.completed[ex.id] = nv;
    cb.checked = nv;
    row.classList.toggle('completed', nv);
    saveState();
    if (navigator.vibrate) navigator.vibrate(6);
    onChange && onChange();
  });
  return row;
}

function renderRoutineExercises(container, routine, iso, log, opts) {
  opts = opts || {};
  const trackSets = opts.trackSets !== false;
  const onChange = opts.onChange || null;
  if (!routine || !routine.blocks) {
    container.appendChild(el('div', 'muted', 'No routine defined.'));
    return;
  }
  const w = log.workout;
  if (!w.completed) w.completed = {};
  if (!w.sets) w.sets = {};

  routine.blocks.forEach(block => {
    const b = el('div', 'block');
    b.appendChild(el('div', 'block-title', block.name));
    const liteBlock = trackSets && isWarmupBlock(block); // warm-up → compact check-off, no set grid
    block.exercises.forEach(ex => {
      if (liteBlock) { b.appendChild(buildLiteExRow(ex, w, onChange)); return; }
      const completed = !!w.completed[ex.id];
      const exDiv = el('div', 'ex' + (completed ? ' completed' : ''));

      const head = el('div', 'ex-head');
      const left = el('div', 'ex-head-left');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.className = 'ex-check'; cb.checked = completed;
      cb.addEventListener('change', () => {
        w.completed[ex.id] = cb.checked;
        exDiv.classList.toggle('completed', cb.checked);
        saveState();
        onChange && onChange();
      });
      left.appendChild(cb);
      const nameEl = el('div', 'ex-name' + (trackSets ? ' tappable' : ''), ex.name);
      if (trackSets) {
        nameEl.title = 'Tap to see history';
        nameEl.addEventListener('click', (e) => {
          e.stopPropagation();
          openExerciseHistory(ex.id, ex.name, iso);
        });
      }
      left.appendChild(nameEl);
      head.appendChild(left);
      head.appendChild(el('div', 'ex-prescription', ex.prescription || ''));
      exDiv.appendChild(head);
      if (ex.note) exDiv.appendChild(el('div', 'ex-note', ex.note));

      if (trackSets) {
        // Last time hint
        const lastEx = lastExerciseSession(ex.id, iso);
        if (lastEx) {
          const tb = isTimeBased(ex.prescription);
          const setsStr = formatLastSets(lastEx.sets, tb);
          const rpe = avgRpeOf(lastEx.sets);
          const lastDiv = el('div', 'ex-last');
          lastDiv.appendChild(el('span', 'when', formatWhen(lastEx.iso, iso)));
          lastDiv.appendChild(el('span', 'sep', '·'));
          lastDiv.appendChild(el('span', null, setsStr));
          if (rpe !== null) {
            lastDiv.appendChild(el('span', 'sep', '·'));
            lastDiv.appendChild(el('span', null, 'RPE ' + (rpe % 1 === 0 ? rpe : rpe.toFixed(1))));
          }
          exDiv.appendChild(lastDiv);
        }

        if (!w.sets[ex.id]) {
          const n = setsFromPrescription(ex.prescription);
          w.sets[ex.id] = Array.from({length: n}, () => ({ reps:'', kg:'', rpe:'' }));
        }
        const timeBased = isTimeBased(ex.prescription);
        const setsDiv = el('div', 'ex-sets');
        w.sets[ex.id].forEach((s, i) => {
          const lastSet = lastEx && lastEx.sets[i] ? lastEx.sets[i] : null;
          setsDiv.appendChild(makeSetRow(s, i, timeBased, lastSet));
        });
        const addBtn = el('button', 'add-set', '+ add set');
        addBtn.addEventListener('click', () => {
          const newSet = { reps:'', kg:'', rpe:'' };
          w.sets[ex.id].push(newSet);
          saveState();
          const lastSet = lastEx && lastEx.sets[w.sets[ex.id].length - 1] ? lastEx.sets[w.sets[ex.id].length - 1] : null;
          setsDiv.insertBefore(makeSetRow(newSet, w.sets[ex.id].length - 1, timeBased, lastSet), addBtn);
        });
        setsDiv.appendChild(addBtn);
        exDiv.appendChild(setsDiv);

        // "Same as last time" repeat button — only when there's a last session AND at least one set is empty
        if (lastEx && w.sets[ex.id].some(s => !s.reps && !s.kg && !s.rpe)) {
          const repeatBtn = el('button', 'repeat-btn');
          repeatBtn.appendChild(el('span', null, '↶ Same as last time'));
          const summary = el('span', null, '(' + formatLastSets(lastEx.sets, timeBased) + ')');
          summary.style.opacity = '0.7';
          repeatBtn.appendChild(summary);
          repeatBtn.addEventListener('click', () => {
            // Fill only empty sets, preserve any already-edited ones
            w.sets[ex.id].forEach((s, i) => {
              const ls = lastEx.sets[i];
              if (!ls) return;
              if (!s.reps) s.reps = ls.reps || '';
              if (!s.kg)   s.kg   = ls.kg   || '';
              if (!s.rpe)  s.rpe  = ls.rpe  || '';
            });
            saveState();
            renderToday(iso);
            if (navigator.vibrate) navigator.vibrate(8);
          });
          exDiv.appendChild(repeatBtn);
        }
      }
      b.appendChild(exDiv);
    });
    container.appendChild(b);
  });
}

function rangeOptions(min, max, step) {

  }
  return arr;
}

function openWheelPicker(opts, onPick) {
  const { value, options, label, suffix = '' } = opts;

  let backdrop = document.getElementById('sheet-backdrop');
  if (!backdrop) {
    backdrop = el('div', 'sheet-backdrop');
    backdrop.id = 'sheet-backdrop';
    document.body.appendChild(backdrop);
  }
  const existing = document.getElementById('picker-sheet');
  if (existing) existing.remove();

  const sheet = el('div', 'sheet');
  sheet.id = 'picker-sheet';
  sheet.appendChild(el('div', 'sheet-handle'));

  const head = el('div', 'sheet-head');
  const cancelBtn = el('button', 'sheet-cancel', 'Cancel');
  const title = el('div', 'sheet-title', label || '');
  const doneBtn = el('button', 'sheet-done', 'Done');
  head.appendChild(cancelBtn); head.appendChild(title); head.appendChild(doneBtn);
  sheet.appendChild(head);

  const wheel = el('div', 'wheel');
  wheel.appendChild(el('div', 'wheel-rail'));
  const scrollEl = el('div', 'wheel-scroll');
  wheel.appendChild(scrollEl);
  sheet.appendChild(wheel);

  const formatVal = (v) => Number.isInteger(v) ? String(v) : v.toString();
  options.forEach((v, i) => {
    const item = el('div', 'wheel-item');
    item.appendChild(document.createTextNode(formatVal(v)));
    if (suffix) item.appendChild(el('span', 'suffix', suffix));
    item.dataset.idx = i;
    item.addEventListener('click', () => {
      scrollEl.scrollTo({ top: i * 44, behavior: 'smooth' });
    });
    scrollEl.appendChild(item);
  });

  // Initial index — closest option to current value
  let selectedIdx = 0;
  if (value !== null && value !== undefined && value !== '') {
    const num = parseFloat(value);
    if (!isNaN(num)) {
      let bestDist = Infinity;
      options.forEach((v, i) => {
        const d = Math.abs(v - num);
        if (d < bestDist) { bestDist = d; selectedIdx = i; }
      });
    }
  }
  const items = scrollEl.querySelectorAll('.wheel-item');

  const setSelected = (idx) => {
    if (idx === selectedIdx) return;
    items[selectedIdx] && items[selectedIdx].classList.remove('selected');
    items[idx] && items[idx].classList.add('selected');
    selectedIdx = idx;
    if (navigator.vibrate) navigator.vibrate(3);
  };

  document.body.appendChild(sheet);

  scrollEl.addEventListener('scroll', () => {
    const idx = Math.round(scrollEl.scrollTop / 44);
    if (idx >= 0 && idx < options.length) setSelected(idx);
  }, { passive: true });

  requestAnimationFrame(() => {
    scrollEl.scrollTop = selectedIdx * 44;

function openExerciseHistory(exId, exName, currentISO) {
  const history = [];
  Object.entries(state.logs).forEach(([iso, log]) => {
    if (iso >= currentISO) return;

    subtitle.textContent = `${history.length} session${history.length === 1 ? '' : 's'} logged`;

      const dateStr = new Date(h.iso + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

// Prescription helpers + multi-wheel picker (Plan tab)
function parsePrescription(s) {
  s = String(s || '').trim();
  const m = s.match(/(\d+)\s*[×x]\s*(\d+(?:\.\d+)?)\s*(s|sec|"|')?/i);
  if (!m) return { sets: 3, amount: 8, unit: 'reps' };
  const sets = parseInt(m[1]);
  const amount = parseFloat(m[2]);
  const sfx = (m[3] || '').toLowerCase();
  const unit = (sfx === 's' || sfx === 'sec' || sfx === '"' || sfx === "'") ? 'sec' : 'reps';
  return { sets, amount, unit };
}
function formatPrescription(p) {
  return `${p.sets} × ${p.amount}${p.unit === 'sec' ? 's' : ''}`;
}

function makeWheelComponent(options, initialValue, suffix, opts) {
  opts = opts || {};
  const wheel = el('div', 'wheel');
  wheel.appendChild(el('div', 'wheel-rail'));
  const scrollEl = el('div', 'wheel-scroll');
  wheel.appendChild(scrollEl);

  options.forEach((v, i) => {
    const item = el('div', 'wheel-item');
    if (opts.renderItem) {
      opts.renderItem(item, v);
    } else {
      item.appendChild(document.createTextNode(Number.isInteger(v) ? String(v) : v.toString()));
      if (suffix) item.appendChild(el('span', 'suffix', suffix));
    }
    item.dataset.idx = i;
    item.addEventListener('click', () => scrollEl.scrollTo({ top: i * 44, behavior: 'smooth' }));
    scrollEl.appendChild(item);
  });

  let selectedIdx = 0;
  if (opts.findIdx) {
    const found = opts.findIdx(options, initialValue);
    if (found >= 0) selectedIdx = found;
  } else if (initialValue !== null && initialValue !== undefined && initialValue !== '') {
    const num = parseFloat(initialValue);
    if (!isNaN(num)) {
      let bestDist = Infinity;
      options.forEach((v, i) => {
        const d = Math.abs(v - num);
        if (d < bestDist) { bestDist = d; selectedIdx = i; }
      });
    }
  }
  const items = scrollEl.querySelectorAll('.wheel-item');
  if (items[selectedIdx]) items[selectedIdx].classList.add('selected');

  scrollEl.addEventListener('scroll', () => {
    const idx = Math.round(scrollEl.scrollTop / 44);
    if (idx >= 0 && idx < options.length && idx !== selectedIdx) {
      if (items[selectedIdx]) items[selectedIdx].classList.remove('selected');
      if (items[idx]) items[idx].classList.add('selected');
      selectedIdx = idx;
      if (navigator.vibrate) navigator.vibrate(3);
    }
  }, { passive: true });

  return {
    el: wheel,
    getValue: () => options[selectedIdx],
    syncScroll: () => { scrollEl.scrollTop = selectedIdx * 44; }
  };
}

// === Time / distance helpers (for run + swim) ===
function parseTimeMS(s) {
  if (!s) return [0, 0];
  if (typeof s === 'string' && s.includes(':')) {
    const parts = s.split(':').map(p => parseInt(p, 10) || 0);
    return [parts[0] || 0, parts[1] || 0];
  }
  const num = parseFloat(s);
  if (isNaN(num)) return [0, 0];
  const min = Math.floor(num);
  const sec = Math.round((num - min) * 60);
  return [min, sec === 60 ? 0 : sec];
}
function formatTimeMS(min, sec) {
  return `${min}:${String(sec).padStart(2, '0')}`;
}
function parseDurationToMinutes(s) {
  if (!s) return NaN;
  if (typeof s === 'string' && s.includes(':')) {
    const parts = s.split(':').map(p => parseInt(p, 10) || 0);
    if (parts.length === 2) return parts[0] + parts[1] / 60;
    if (parts.length === 3) return parts[0] * 60 + parts[1] + parts[2] / 60;
  }
  return parseFloat(s);
}
function parseDistanceKM(s) {
  if (!s) return [0, 0];
  const num = parseFloat(s);
  if (isNaN(num)) return [0, 0];
  const km = Math.floor(num);
  const m = Math.round((num - km) * 1000 / 10) * 10;
  return [km, m === 1000 ? 0 : m];
}
function formatDistanceKM(km, m) {
  return (km + m / 1000).toFixed(2);
}

function renderRunBody(container, variant, iso, log, onChange) {
  const w = ensureWorkout(log, { type: 'run' });
  const routine = getRunRoutine(variant);
  const fields = w.fields;
  const lastRun = lastTypeSession('run', iso);

  // Avg pace is always derived from distance ÷ duration
  const computePace = () => {
    const km = parseFloat(fields.distance);
    const durMin = parseDurationToMinutes(fields.duration);
    fields.avgPace = (km > 0 && !isNaN(durMin) && durMin > 0) ? secondsToPace(Math.round(durMin * 60 / km)) : '';
  };

  // While the session is still open, pre-fill distance/duration from the plan
  // target (falling back to the last run) so there's less to type.
  if (w.status !== 'done') {
    let changed = false;
    if (!fields.distance && !fields.duration) {
      fields.distance = routine.targetDistance || (lastRun && lastRun.fields.distance) || '';
      fields.duration = routine.targetDuration || (lastRun && lastRun.fields.duration) || '';
      changed = !!(fields.distance || fields.duration);
    }
    const prevPace = fields.avgPace;
    computePace();
    if (changed || fields.avgPace !== prevPace) saveState();
  }

  if (lastRun) appendLastSession(container, lastRun, iso, 'run');

  const ig = el('div', 'input-grid');
  let paceBox = null;
  const refreshPace = () => {
    if (!paceBox) return;
    paceBox.textContent = fields.avgPace ? fields.avgPace + '/km' : '–';
    paceBox.classList.toggle('empty', !fields.avgPace);
  };

  ig.appendChild(pickerField('Distance',
    () => fields.distance ? fields.distance + ' km' : '',
    (refresh) => openDistanceKmPicker(fields.distance, (v) => { fields.distance = v; computePace(); saveState(); refresh(); refreshPace(); })
  ));
  ig.appendChild(pickerField('Duration',
    () => fields.duration ? fields.duration : '',
    (refresh) => openDurationPicker(fields.duration, (v) => { fields.duration = v; computePace(); saveState(); refresh(); refreshPace(); })
  ));

  // Avg pace — auto-calculated, read-only
  const paceWrap = el('div');
  paceWrap.appendChild(el('label', 'muted', 'Avg pace · auto'));
  paceBox = el('div', 'picker-field readonly');
  paceWrap.appendChild(paceBox);
  ig.appendChild(paceWrap);
  refreshPace();

  ig.appendChild(pickerField('RPE',
    () => fields.rpe ? String(fields.rpe) : '',
    (refresh) => openWheelPicker({ value: fields.rpe, options: rangeOptions(0, 10, 0.5), label: 'RPE (1–10)' },
      (v) => { fields.rpe = String(v); saveState(); refresh(); })
  ));
  container.appendChild(ig);

  // No warm-up / main / cool-down boxes here — a run is marked done as a whole.
  // (The structure stays in the Plan tab as reference.)
  container.appendChild(notesArea(w, 'Session notes'));
}

  if (!swapSourceISO) return;

  const sourceSched = getEffectiveSchedule(swapSourceISO);

  swapSourceISO = null;
  renderWeek();
  toast('Days swapped ✓');
}

  head.appendChild(cancelBtn);
  head.appendChild(el('div', 'sheet-title', dayLabel));
  head.appendChild(doneBtn);
  sheet.appendChild(head);

  // Workout wheel — scroll-snap selection
  const wheel = makeWheelComponent(WORKOUT_OPTIONS, currentKey, '', {
    renderItem: (item, opt) => {
      const line = el('span', 'workout-line');
      line.appendChild(el('span', 'emoji', workoutEmoji(opt.workout)));
      line.appendChild(el('span', 'label', workoutLabel(opt.workout)));
      item.appendChild(line);
    },
    findIdx: (options, val) => options.findIndex(o => o.key === val)
  });
  sheet.appendChild(wheel.el);

  // Action buttons below the wheel
  if (handlers.onOpen) {
    const openAction = el('div', 'sheet-action', '▶ Open this day');
    openAction.addEventListener('click', () => { close(false); handlers.onOpen(); });
    sheet.appendChild(openAction);
  }
  if (handlers.onSwap) {
    const swapAction = el('div', 'sheet-action', '⇄ Swap with another day…');
    swapAction.addEventListener('click', () => { close(false); handlers.onSwap(); });
    sheet.appendChild(swapAction);
  }

  document.body.appendChild(sheet);

  const close = (commit) => {
    sheet.classList.remove('open');
    backdrop.classList.remove('open');
    setTimeout(() => sheet.remove(), 280);
    if (commit && handlers.onPick) {
      const picked = wheel.getValue();
      if (picked && picked.key !== currentKey) handlers.onPick(picked.workout);
    }
  };
  backdrop.onclick = () => close(false);
  cancelBtn.onclick = () => close(false);
  doneBtn.onclick = () => close(true);

  requestAnimationFrame(() => {
    backdrop.classList.add('open');
    sheet.classList.add('open');
    wheel.syncScroll();
  });
}

// Drag-and-drop for day rows — dragged element is the .movable-content (workout card)
function setupDayDrag(handle, draggedEl, iso) {
  let drag = null;

  const onPointerMove = (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.startX;
    const dy = e.clientY - drag.startY;

    if (!drag.activated) {
      if (Math.abs(dx) + Math.abs(dy) > 8) {
        drag.activated = true;
        const rect = draggedEl.getBoundingClientRect();
        const ghost = draggedEl.cloneNode(true);
        ghost.classList.add('dragging-ghost');
        ghost.style.width = rect.width + 'px';
        ghost.style.height = rect.height + 'px';
        drag.offsetX = e.clientX - rect.left;
        drag.offsetY = e.clientY - rect.top;
        document.body.appendChild(ghost);
        drag.ghost = ghost;
        draggedEl.classList.add('dragging-source');
      }
    }

    if (drag.activated) {
      drag.ghost.style.left = (e.clientX - drag.offsetX) + 'px';
      drag.ghost.style.top = (e.clientY - drag.offsetY) + 'px';

      const elUnder = document.elementFromPoint(e.clientX, e.clientY);
      const targetRow = elUnder ? elUnder.closest('.day-row') : null;
      document.querySelectorAll('.day-row.drag-over').forEach(r => r.classList.remove('drag-over'));
      if (targetRow && targetRow.dataset.iso && targetRow.dataset.iso !== iso && targetRow.dataset.locked !== 'true') {
        targetRow.classList.add('drag-over');
        drag.targetISO = targetRow.dataset.iso;
      } else {
        drag.targetISO = null;
      }
    }
  };

  const onPointerUp = (e) => {
    if (!drag) return;
    document.removeEventListener('pointermove', onPointerMove);

    const wasActivated = drag.activated;
    const targetISO = drag.targetISO;

    document.querySelectorAll('.day-row.drag-over').forEach(r => r.classList.remove('drag-over'));
    if (drag.ghost) drag.ghost.remove();
    draggedEl.classList.remove('dragging-source');
    drag = null;

    if (wasActivated && targetISO) {
      const sourceSched = getEffectiveSchedule(iso);
      const targetSched = getEffectiveSchedule(targetISO);
      setScheduleOverride(iso, targetSched);
      setScheduleOverride(targetISO, sourceSched);
      if (navigator.vibrate) navigator.vibrate(15);
      renderWeek();
      toast('Days swapped ✓');
    }
  };

  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    drag = { startX: e.clientX, startY: e.clientY, activated: false, ghost: null, targetISO: null };
    handle.setPointerCapture(e.pointerId);
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp, { once: true });
    document.addEventListener('pointercancel', onPointerUp, { once: true });
  });
}

function renderWeek() {
  const root = document.getElementById('tab-week');
  root.innerHTML = '';
  const today = todayISO();
  const monday = startOfWeekISO(state.viewISO || today);
  const days = Array.from({length:7}, (_,i) => addDaysISO(monday, i));

  if (swapSourceISO) {
    const sourceLabel = new Date(swapSourceISO + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'long' });
    const banner = el('div', 'swap-banner');
    const text = el('span');
    text.innerHTML = `Pick a day to swap with <strong>${sourceLabel}</strong>`;
    const cancelBtn = el('button', 'btn small ghost', 'Cancel');
    cancelBtn.addEventListener('click', cancelSwap);
    banner.appendChild(text);
    banner.appendChild(cancelBtn);
    root.appendChild(banner);
  }

  const card = el('div', 'card');
  const head = el('div', 'plan-section-head');
  head.appendChild(el('h2', null, 'This week'));
  const resetBtn = el('button', 'btn small ghost', 'Reset to default');
  resetBtn.addEventListener('click', () => {
    if (confirm('Reset this week\'s schedule to the default?')) {
      resetWeekOverrides(monday);
      renderWeek();
      toast('Week reset');
    }
  });
  head.appendChild(resetBtn);
  card.appendChild(head);

  const hint = swapSourceISO
    ? niceRange(days[0], days[6]) + ' · tap a day to complete the swap'
    : niceRange(days[0], days[6]) + ' · tap row to change · drag ⋮⋮ to swap';
  card.appendChild(el('div', 'muted', hint));

  const list = el('div', 'week-list');
  const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  days.forEach((iso, i) => {
    const sched = getEffectiveSchedule(iso);
    const log = state.logs[iso] || {};
    const status = log.workout && log.workout.status;
    const isSource = swapSourceISO === iso;
    const inSwapMode = !!swapSourceISO;

    const isPast = iso < today;
    // Done / skipped / past days are settled — their plan shouldn't be reordered
    const locked = isPast || status === 'done' || status === 'skipped';

    let classes = 'day-row';
    if (iso === today) classes += ' today';
    if (status === 'done') classes += ' completed';
    if (status === 'skipped') classes += ' skipped';
    if (isPast) classes += ' past';
    if (locked) classes += ' locked';
    if (isSource) classes += ' swap-source';
    const row = el('div', classes);
    row.dataset.iso = iso;
    row.dataset.locked = locked ? 'true' : 'false';

    // Fixed date column — stays in place during drag
    const date = el('div', 'day-date');
    date.appendChild(el('div', 'dow', DOW[i]));
    date.appendChild(el('div', 'dnum', String(new Date(iso+'T12:00:00').getDate())));
    row.appendChild(date);

    // Movable workout card — the part that drags
    const card = el('div', 'movable-content');

    const wo = el('div', 'day-workout');
    wo.appendChild(el('div', 'icon', workoutEmoji(sched)));
    const info = el('div', 'info');
    info.appendChild(el('div', 'name', workoutLabel(sched)));
    if (status === 'done') {
      info.appendChild(el('div', 'sub done', '✓ Completed'));
    } else if (status === 'skipped') {
      info.appendChild(el('div', 'sub skipped', '× Skipped'));
    } else {
      const subTxt = workoutSubLabel(sched);
      if (subTxt) info.appendChild(el('div', 'sub', subTxt));
    }
    wo.appendChild(info);
    card.appendChild(wo);

    let handle = null;
    if (locked) {
      const lock = el('div', 'day-lock', '🔒');
      lock.title = status === 'done' ? 'Completed · locked from reordering'
                 : status === 'skipped' ? 'Skipped · tap to change or log'
                 : 'Past day · tap to change or log';
      card.appendChild(lock);
    } else {
      handle = el('div', 'drag-handle', '⋮⋮');
      handle.title = 'Drag to swap with another day';
      card.appendChild(handle);
    }

    row.appendChild(card);

    if (inSwapMode) {
      // Only editable (unlocked) days are valid swap targets
      if (!locked) row.addEventListener('click', () => performSwap(iso));
    } else if (locked && status === 'done') {
      // Completed & logged — open to review (to redo it, delete the entry in History)
      card.addEventListener('click', () => jumpToToday(iso));
    } else if (locked) {
      // Past / skipped but not completed — correcting it still makes sense:
      // change the workout (e.g. to Rest) or open the day to log what happened.
      // Only reordering (swap/drag) is disabled.
      card.addEventListener('click', () => openWorkoutSheet(iso, {
        onPick: (workout) => { setScheduleOverride(iso, workout); renderWeek(); },
        onOpen: () => jumpToToday(iso)
      }));
    } else {
      // Editable day — tap card → wheel picker; drag handle → swap drag
      card.addEventListener('click', (e) => {
        if (e.target.closest('.drag-handle')) return;
        openWorkoutSheet(iso, {
          onPick: (workout) => { setScheduleOverride(iso, workout); renderWeek(); },
          onSwap: () => enterSwapMode(iso),
          onOpen: () => jumpToToday(iso)
        });
      });
      setupDayDrag(handle, card, iso);
    }

    list.appendChild(row);
  });
  card.appendChild(list);
  root.appendChild(card);
}

function jumpToToday(iso) {
  state.viewISO = iso;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelector('.tab[data-tab="today"]').classList.add('active');
  document.getElementById('tab-week').style.display = 'none';
  document.getElementById('tab-plan').style.display = 'none';
  document.getElementById('tab-today').style.display = '';
  renderToday(iso);
}

function niceRange(a, b) {
  const A = new Date(a+'T12:00:00'); const B = new Date(b+'T12:00:00');
  const fmt = (d, opts) => d.toLocaleDateString(undefined, opts);
  if (A.getMonth() === B.getMonth()) {
    return `${fmt(A,{month:'long'})} ${A.getDate()}–${B.getDate()}`;
  }
  return `${fmt(A,{month:'short',day:'numeric'})} – ${fmt(B,{month:'short',day:'numeric'})}`;
}

function renderEditableRoutine(container, routine, onMutate) {
  routine.blocks.forEach((block, bIdx) => {
    const b = el('div', 'block');
    const bt = el('div', 'block-title');

    const blockNameInp = document.createElement('input');
    blockNameInp.className = 'block-name-input';
    blockNameInp.value = block.name;
    blockNameInp.addEventListener('input', () => { block.name = blockNameInp.value; saveState(); });
    bt.appendChild(blockNameInp);

    const btActions = el('div', 'row');
    btActions.style.gap = '4px';
    const addExBtn = el('button', 'btn small', '+ exercise');
    addExBtn.addEventListener('click', () => {
      const newId = `c-${Date.now()}-${Math.random().toString(36).slice(2,5)}`;
      const newEx = { id: newId, name: '', prescription: '3 × 8', note: '' };
      block.exercises.push(newEx);
      saveState();
      const newRow = buildPlanExRow(block, newEx);
      b.appendChild(newRow);                 // append in place — keeps the routine expanded
      openExerciseEditor(block, newEx, newRow);  // open editor to name it right away
    });
    const delBlockBtn = el('button', 'icon-btn', '✕');
    delBlockBtn.title = 'Delete block';
    delBlockBtn.addEventListener('click', () => {
      if (block.exercises.length && !confirm(`Delete block "${block.name}" and its ${block.exercises.length} exercises?`)) return;
      routine.blocks.splice(bIdx, 1);
      onMutate();
    });
    btActions.appendChild(addExBtn);
    btActions.appendChild(delBlockBtn);
    bt.appendChild(btActions);
    b.appendChild(bt);

    block.exercises.forEach((ex) => b.appendChild(buildPlanExRow(block, ex)));
    container.appendChild(b);
  });

  const addBlockBtn = el('button', 'btn small ghost', '+ add block');
  addBlockBtn.style.marginTop = '8px';
  addBlockBtn.addEventListener('click', () => {
    routine.blocks.push({ name: 'New block', exercises: [] });
    onMutate();
  });
  container.appendChild(addBlockBtn);
}

// One compact exercise line. Sets×reps (e.g. "2 × 10") show in the left column and
// tap → picker; free-text targets (e.g. "15 min easy") show inline after the name.
// Tap the name → editor sheet (rename / note / delete). No inline notes box or ✕.
function buildPlanExRow(block, ex) {
  const row = el('div', 'plan-ex-row');
  const presc = (ex.prescription || '').trim();
  // Clean "N × M" / "N × M-M-M" / "N × Ms" go in the reps column; anything with
  // extra words (e.g. "6 × 30s hard") is treated as a free-text target instead.
  const isSetsReps = /^\d+\s*×\s*[\d-]+s?\s*$/.test(presc);

  if (isSetsReps) {
    const reps = el('div', 'plan-ex-reps');
    const showReps = () => { reps.textContent = (ex.prescription || '').replace(/\s*×\s*/g, '×'); };
    showReps();
    reps.title = 'Tap to set sets × reps';
    reps.addEventListener('click', () => {
      openPrescriptionPicker(parsePrescription(ex.prescription), (vals) => {
        ex.prescription = formatPrescription(vals);
        saveState();
        showReps();
      });
    });
    row.appendChild(reps);
  }

  const main = el('div', 'plan-ex-main');
  main.appendChild(el('span', 'plan-ex-name', ex.name || 'Untitled'));
  if (!isSetsReps && presc) main.appendChild(el('span', 'plan-ex-presc', presc));
  if (ex.note) main.appendChild(el('span', 'plan-ex-note', ex.note));
  main.title = 'Tap to rename, note, or delete';
  main.addEventListener('click', () => openExerciseEditor(block, ex, row));
  row.appendChild(main);

  return row;
}

// Bottom-sheet editor reached by tapping an exercise name. Edits save live and
// update the row in place (no full re-render, so the routine stays expanded).
function openExerciseEditor(block, ex, rowEl) {
  let backdrop = document.getElementById('sheet-backdrop');
  if (!backdrop) { backdrop = el('div', 'sheet-backdrop'); backdrop.id = 'sheet-backdrop'; document.body.appendChild(backdrop); }
  const existing = document.getElementById('picker-sheet');
  if (existing) existing.remove();

  const sheet = el('div', 'sheet'); sheet.id = 'picker-sheet';
  sheet.appendChild(el('div', 'sheet-handle'));

  const head = el('div', 'sheet-head');
  const cancelBtn = el('button', 'sheet-cancel', 'Close');
  const doneBtn = el('button', 'sheet-done', 'Done');
  head.appendChild(cancelBtn);
  head.appendChild(el('div', 'sheet-title', 'Edit exercise'));
  head.appendChild(doneBtn);
  sheet.appendChild(head);

  const body = el('div', 'ex-editor');

  body.appendChild(el('label', 'ex-editor-label', 'Exercise'));
  const nameInp = document.createElement('input');
  nameInp.className = 'ex-editor-input'; nameInp.value = ex.name || ''; nameInp.placeholder = 'Exercise name';
  nameInp.addEventListener('input', () => {
    ex.name = nameInp.value; saveState();
    const ns = rowEl.querySelector('.plan-ex-name'); if (ns) ns.textContent = ex.name || 'Untitled';
  });
  body.appendChild(nameInp);

  body.appendChild(el('label', 'ex-editor-label', 'Note / cue (optional)'));
  const noteInp = document.createElement('input');
  noteInp.className = 'ex-editor-input'; noteInp.value = ex.note || ''; noteInp.placeholder = 'e.g. Each side';
  noteInp.addEventListener('input', () => {
    ex.note = noteInp.value; saveState();
    const main = rowEl.querySelector('.plan-ex-main');
    let nspan = rowEl.querySelector('.plan-ex-note');
    if (ex.note) {
      if (!nspan) { nspan = el('span', 'plan-ex-note'); main.appendChild(nspan); }
      nspan.textContent = ex.note;
    } else if (nspan) { nspan.remove(); }
  });
  body.appendChild(noteInp);

  const delBtn = el('button', 'btn small ghost danger del-ex', 'Delete exercise');
  delBtn.addEventListener('click', () => {
    const i = block.exercises.indexOf(ex);
    if (i >= 0) block.exercises.splice(i, 1);
    saveState();
    rowEl.remove();
    close();
    toast('Exercise deleted');
  });
  body.appendChild(delBtn);

  sheet.appendChild(body);
  document.body.appendChild(sheet);

  const close = () => {
    sheet.classList.remove('open'); backdrop.classList.remove('open');
    setTimeout(() => sheet.remove(), 280);
  };
  backdrop.onclick = close;
  cancelBtn.onclick = close;
  doneBtn.onclick = close;

  requestAnimationFrame(() => {
    backdrop.classList.add('open');
    sheet.classList.add('open');
    if (!ex.name) setTimeout(() => nameInp.focus(), 320); // new exercise → start typing
  });
}

function buildEntrySnapshot(iso, sched, w) {
  const snap = {
    date: iso,
    workoutType: sched.type,
    workoutLabel: workoutLabel(sched),
    notes: w.notes || '',
    fields: { ...(w.fields || {}) }
  };
  let routine = null;
  if (sched.type === 'gym')  routine = getGym()[sched.dayIdx];
  else if (sched.type === 'swim') routine = getSwim();
  else if (sched.type === 'run')  routine = getRunRoutine(sched.variant);
  if (routine && routine.blocks) {
    snap.exercises = routine.blocks.flatMap(b => b.exercises.map(ex => ({
      block: b.name,
      name: ex.name,
      prescription: ex.prescription || '',
      completed: !!(w.completed && w.completed[ex.id]),
      sets: (w.sets && w.sets[ex.id] ? w.sets[ex.id] : []).map(s => ({
        reps: s.reps || '', kg: s.kg || '', rpe: s.rpe || ''
      }))
    })));
  }
  return snap;
}

function allEntries() {
  // Return all logs with status==='done', sorted newest first
  const arr = [];
  Object.entries(state.logs).forEach(([iso, log]) => {
    if (log.workout && log.workout.status === 'done') {
      arr.push({ iso, log });
    }
  });
  arr.sort((a, b) => {
    const ta = a.log.workout.completedAt || a.iso;
    const tb = b.log.workout.completedAt || b.iso;
    return tb.localeCompare(ta);
  });
  return arr;
}

function entryStats(entry) {
  const w = entry.log.workout;
  if (!w) return [];
  const out = [];
  if (w.type === 'gym') {
    const exs = w.snapshot?.exercises || [];
    const completed = exs.filter(e => e.completed).length;
    const totalSets = exs.reduce((n, e) => n + (e.sets || []).filter(s => s.reps).length, 0);
    out.push(`${completed}/${exs.length} exercises`);
    out.push(`${totalSets} sets logged`);
    // avg RPE across sets
    let rs = 0, rn = 0;
    exs.forEach(e => (e.sets||[]).forEach(s => { const v = parseFloat(s.rpe); if (!isNaN(v)) { rs+=v; rn++; } }));
    if (rn) out.push(`RPE ${(rs/rn).toFixed(1)}`);
  } else if (w.type === 'run') {
    const f = w.fields || {};
    if (f.distance) out.push(`${f.distance} km`);
    if (f.duration) out.push(`${f.duration}`);
    if (f.avgPace)  out.push(`${f.avgPace}/km`);
    if (f.rpe)      out.push(`RPE ${f.rpe}`);
  } else if (w.type === 'swim') {
    const exs = w.snapshot?.exercises || [];
    const completed = exs.filter(e => e.completed).length;
    if (exs.length) out.push(`${completed}/${exs.length} exercises`);
    const f = w.fields || {};
    if (f.distance) out.push(`${f.distance} m`);
    if (f.duration) out.push(`${f.duration}`);
    if (f.rpe)      out.push(`RPE ${f.rpe}`);
  } else if (w.type === 'yoga') {
    const f = w.fields || {};
    if (f.duration) out.push(`${f.duration}`);
    if (f.rpe)      out.push(`Felt ${f.rpe}`);
  }
  return out;
}

// ============================================================
//  PROGRESS CHARTS (run + swim)
// ============================================================

const WEEK_BARS   = 12;        // weekly buckets in 'week' timeframe
const MONTH_BARS  = 6;         // monthly buckets in 'month' timeframe
const RUN_COLOR   = '#60a5fa'; // running volume + intervals dots
const LONG_COLOR  = '#fbbf24'; // long-run dots
const SWIM_COLOR  = '#22d3ee'; // swimming volume
let runChartMetric = 'distance'; // 'distance' | 'pace' (session-only)
let chartTimeframe = 'week';     // 'week' | 'month' (session-only)

function doneWorkoutsOfType(type) {
  const arr = [];
  Object.entries(state.logs).forEach(([iso, log]) => {
    const w = log && log.workout;
    if (!w || w.status !== 'done') return;
    const t = (w.snapshot && w.snapshot.workoutType) || w.type;
    if (t === type) arr.push({ iso, w });
  });
  arr.sort((a, b) => a.iso.localeCompare(b.iso)); // oldest → newest
  return arr;
}

function paceToSeconds(s) {
  if (!s || typeof s !== 'string' || !s.includes(':')) return 0;
  const [m, sec] = s.split(':').map(n => parseInt(n, 10) || 0);
  return m * 60 + sec;
}
function secondsToPace(sec) {
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}
function fmtMeters(m) {
  if (m >= 1000) return (m / 1000).toFixed(m % 1000 === 0 ? 0 : 1) + ' km';
  return Math.round(m) + ' m';
}
function monthShort(iso) {
  return new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { month: 'short' });
}

// Time buckets for the active timeframe (oldest first). Each: {startISO, endISO, sum, mode}
function recentBuckets() {
  return chartTimeframe === 'month' ? recentMonthBuckets() : recentWeekBuckets();
}
function recentWeekBuckets() {
  const monday = startOfWeekISO(todayISO());
  const out = [];
  for (let i = WEEK_BARS - 1; i >= 0; i--) {
    const s = addDaysISO(monday, -7 * i);
    out.push({ startISO: s, endISO: addDaysISO(s, 7), sum: 0, mode: 'week' });
  }
  return out;
}
function recentMonthBuckets() {
  const base = new Date(todayISO() + 'T12:00:00');
  const out = [];
  for (let i = MONTH_BARS - 1; i >= 0; i--) {
    const s = new Date(base.getFullYear(), base.getMonth() - i, 1, 12);
    const e = new Date(base.getFullYear(), base.getMonth() - i + 1, 1, 12);
    out.push({ startISO: toISO(s), endISO: toISO(e), sum: 0, mode: 'month' });
  }
  return out;
}
function addToBuckets(buckets, iso, value) {
  if (isNaN(value)) return;
  for (const b of buckets) {
    if (iso >= b.startISO && iso < b.endISO) { b.sum += value; return; }
  }
}
function timeframeLabel() {
  return chartTimeframe === 'month' ? `last ${MONTH_BARS} months` : `last ${WEEK_BARS} weeks`;
}
function chartWindowStartISO() {
  return recentBuckets()[0].startISO;
}

// Weekly volume bar chart → SVG element
function buildBarChart(buckets, color, fmtVal) {
  const W = 320, H = 150, padL = 8, padR = 8, padT = 16, padB = 22;
  const plotW = W - padL - padR, plotH = H - padT - padB, n = buckets.length;
  const max = Math.max(0, ...buckets.map(b => b.sum));
  const gap = 4, barW = (plotW - gap * (n - 1)) / n;
  const parts = [`<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`];
  parts.push(`<line class="grid-line" x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}"/>`);
  buckets.forEach((b, i) => {
    const x = padL + i * (barW + gap);
    if (b.sum > 0) {
      const h = (b.sum / max) * plotH, y = padT + plotH - h;
      parts.push(`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${color}"/>`);
    } else {
      parts.push(`<rect class="bar-empty" x="${x.toFixed(1)}" y="${(padT + plotH - 3).toFixed(1)}" width="${barW.toFixed(1)}" height="3" rx="1.5"/>`);
    }
    if (n <= 6 || i === 0 || i === n - 1 || i % 3 === 0) {
      const d = new Date(b.startISO + 'T12:00:00');
      const opts = b.mode === 'month' ? { month: 'short' } : { day: 'numeric', month: 'short' };
      parts.push(`<text class="axis-label" x="${(x + barW / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${d.toLocaleDateString(undefined, opts)}</text>`);
    }
  });
  if (max > 0) parts.push(`<text class="axis-label" x="${W - padR}" y="${padT - 4}" text-anchor="end">max ${fmtVal(max)}</text>`);
  parts.push('</svg>');
  const wrap = el('div');
  wrap.innerHTML = parts.join('');
  return wrap.firstChild;
}

// Pace scatter (one dot per run, colored by variant) → SVG element
function buildPaceScatter(runs) {
  const startISO = chartWindowStartISO();
  const pts = runs.map(e => {
    const f = e.w.fields || {};
    let sec = paceToSeconds(f.avgPace);
    if (!sec) {
      const km = parseFloat(f.distance), durMin = parseDurationToMinutes(f.duration);
      if (km > 0 && !isNaN(durMin) && durMin > 0) sec = Math.round(durMin * 60 / km);
    }
    const label = (e.w.snapshot && e.w.snapshot.workoutLabel) || '';
    return { iso: e.iso, sec, variant: /long/i.test(label) ? 'long' : 'intervals' };
  }).filter(p => p.sec > 0 && p.iso >= startISO);

  if (!pts.length) {
    const wrap = el('div');
    wrap.appendChild(el('div', 'chart-empty', 'No pace recorded yet — add pace when you log a run.'));
    return wrap;
  }

  const W = 320, H = 150, padL = 36, padR = 8, padT = 12, padB = 22;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const startMs = new Date(startISO + 'T12:00:00').getTime();
  const spanMs = Math.max(1, new Date(todayISO() + 'T12:00:00').getTime() - startMs);
  const secs = pts.map(p => p.sec);
  let minSec = Math.min(...secs), maxSec = Math.max(...secs);
  if (minSec === maxSec) { minSec -= 15; maxSec += 15; }
  const range = maxSec - minSec;
  const yFor = sec => padT + ((sec - minSec) / range) * plotH; // faster (lower sec) → higher
  const xFor = iso => padL + Math.max(0, Math.min(1, (new Date(iso + 'T12:00:00').getTime() - startMs) / spanMs)) * plotW;

  const parts = [`<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`];
  [minSec, (minSec + maxSec) / 2, maxSec].forEach(sv => {
    const y = yFor(sv);
    parts.push(`<line class="grid-line" x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}"/>`);
    parts.push(`<text class="axis-label" x="${padL - 5}" y="${(y + 3).toFixed(1)}" text-anchor="end">${secondsToPace(Math.round(sv))}</text>`);
  });
  parts.push(`<text class="axis-label" x="${padL}" y="${H - 8}" text-anchor="start">${monthShort(startISO)}</text>`);
  parts.push(`<text class="axis-label" x="${W - padR}" y="${H - 8}" text-anchor="end">now</text>`);
  pts.forEach(p => {
    const col = p.variant === 'long' ? LONG_COLOR : RUN_COLOR;
    parts.push(`<circle class="dot-pt" cx="${xFor(p.iso).toFixed(1)}" cy="${yFor(p.sec).toFixed(1)}" r="4.5" fill="${col}"/>`);
  });
  parts.push('</svg>');
  const wrap = el('div');
  wrap.innerHTML = parts.join('');
  return wrap.firstChild;
}

function renderRunChartCard(root) {
  const runs = doneWorkoutsOfType('run');
  if (!runs.length) return;

  const card = el('div', 'chart-card');
  const head = el('div', 'chart-head');
  const title = el('div', 'chart-title');
  title.innerHTML = `<span class="dot" style="background:${RUN_COLOR}"></span>Running`;
  head.appendChild(title);

  const toggle = el('div', 'chart-toggle');
  const bDist = el('button', null, 'Distance');
  const bPace = el('button', null, 'Pace');
  toggle.appendChild(bDist); toggle.appendChild(bPace);
  head.appendChild(toggle);
  card.appendChild(head);

  const sub = el('div', 'chart-sub');
  card.appendChild(sub);
  const body = el('div');
  card.appendChild(body);

  function draw() {
    bDist.className = runChartMetric === 'distance' ? 'active' : '';
    bPace.className = runChartMetric === 'pace' ? 'active' : '';
    body.innerHTML = '';
    if (runChartMetric === 'distance') {
      const buckets = recentBuckets();
      runs.forEach(e => addToBuckets(buckets, e.iso, parseFloat((e.w.fields || {}).distance)));
      const total = buckets.reduce((n, b) => n + b.sum, 0);
      sub.textContent = `${total.toFixed(1)} km total · ${timeframeLabel()}`;
      body.appendChild(buildBarChart(buckets, RUN_COLOR, v => v.toFixed(1) + ' km'));
    } else {
      sub.textContent = 'Each dot is one run · higher = faster';
      body.appendChild(buildPaceScatter(runs));
      const legend = el('div', 'chart-legend');
      legend.innerHTML = `<span><i style="background:${RUN_COLOR}"></i>Intervals</span>` +
                         `<span><i style="background:${LONG_COLOR}"></i>Long</span>`;
      body.appendChild(legend);
    }
  }
  bDist.addEventListener('click', () => { runChartMetric = 'distance'; draw(); });
  bPace.addEventListener('click', () => { runChartMetric = 'pace'; draw(); });
  draw();
  root.appendChild(card);
}

function renderSwimChartCard(root) {
  const swims = doneWorkoutsOfType('swim');
  if (!swims.length) return;

  const card = el('div', 'chart-card');
  const head = el('div', 'chart-head');
  const title = el('div', 'chart-title');
  title.innerHTML = `<span class="dot" style="background:${SWIM_COLOR}"></span>Swimming`;
  head.appendChild(title);
  card.appendChild(head);

  const sub = el('div', 'chart-sub');
  card.appendChild(sub);

  const buckets = recentBuckets();
  swims.forEach(e => addToBuckets(buckets, e.iso, parseFloat((e.w.fields || {}).distance)));
  const totalM = buckets.reduce((n, b) => n + b.sum, 0);
  sub.textContent = `${fmtMeters(totalM)} total · ${timeframeLabel()}`;
  card.appendChild(buildBarChart(buckets, SWIM_COLOR, fmtMeters));
  root.appendChild(card);
}

// Week / Month switch shared by the trend charts; full re-render keeps both
// charts (and their Distance/Pace state) in sync.
function renderTimeframeToggle(root) {
  const row = el('div', 'timeframe-row');
  const seg = el('div', 'chart-toggle');
  const bW = el('button', chartTimeframe === 'week' ? 'active' : '', 'Weekly');

  bW.addEventListener('click', () => { if (chartTimeframe !== 'week')  { chartTimeframe = 'week';  renderHistory(); } });
  bM.addEventListener('click', () => { if (chartTimeframe !== 'month') { chartTimeframe = 'month'; renderHistory(); } });
  seg.appendChild(bW); seg.appendChild(bM);
