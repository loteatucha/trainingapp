// ============================================================
//  BACKUP (export / import) — keeps data safe across devices
// ============================================================

async function exportBackup() {
  const { viewISO, ...persist } = state;
  const json = JSON.stringify(persist, null, 2);
  const fname = `training-backup-${todayISO()}.json`;
  const file = new File([json], fname, { type: 'application/json' });
  // iOS / PWA: share sheet → Files, Mail, WhatsApp, etc.
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Training backup' }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  // Desktop / fallback: plain download
  const url = URL.createObjectURL(file);
  const a = el('a'); a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup saved');
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (e) { toast('Could not read that file'); return; }
    if (!data || typeof data.logs !== 'object' || data.logs === null) { toast('Not a valid backup file'); return; }
    const days = Object.keys(data.logs).length;
    if (!confirm(`Import this backup?\n\n${days} saved day${days === 1 ? '' : 's'} will be merged in. Your existing days are kept (nothing is overwritten).`)) return;
    let added = 0;
    Object.entries(data.logs).forEach(([iso, log]) => {
      if (!state.logs[iso]) { state.logs[iso] = log; added++; }
    });
    ['customGym', 'customRunIntervals', 'customRunLong', 'customSwim', 'customYoga'].forEach(k => {
      if (data[k] && !state[k]) state[k] = data[k];
    });
    if (data.scheduleOverrides) state.scheduleOverrides = Object.assign({}, data.scheduleOverrides, state.scheduleOverrides);
    saveState();
    renderHistory();
    toast(`Imported — ${added} new day${added === 1 ? '' : 's'} added`);
  };
  reader.readAsText(file);
}

function renderBackupCard(root) {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, 'Backup'));
  card.appendChild(el('div', 'muted', 'Your history lives only on this device. Export a copy now and then — especially before clearing Safari, or to move it to a new phone.'));
  const row = el('div', 'backup-row');
  const exp = el('button', 'btn primary', 'Export backup');
  exp.addEventListener('click', exportBackup);
  const imp = el('button', 'btn', 'Import backup');
  const input = el('input'); input.type = 'file'; input.accept = 'application/json,.json'; input.style.display = 'none';
  input.addEventListener('change', () => { if (input.files[0]) importBackup(input.files[0]); input.value = ''; });
  imp.addEventListener('click', () => input.click());
  row.appendChild(exp); row.appendChild(imp); row.appendChild(input);
  card.appendChild(row);
  root.appendChild(card);
}

//  HISTORY VIEW
// ============================================================

const WEEKLY_GOAL = 5;

function renderWeeklySummary(root) {
  const today = todayISO();
  const monday = startOfWeekISO(today);
  const todayDow = dowFromISO(today);
  const days = Array.from({length:7}, (_,i) => addDaysISO(monday, i));
  const active = days.map(iso => {
    const log = state.logs[iso];
    return !!(log && log.workout && log.workout.status === 'done');
  });
  const count = active.filter(Boolean).length;
  const r = 45;
  const c = 2 * Math.PI * r;
  const progress = Math.min(1, count / WEEKLY_GOAL);
  const offset = c * (1 - progress);

  const card = el('div', 'weekly-summary');

  const ring = el('div', 'weekly-ring');
  ring.innerHTML = `
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ring-bg" cx="50" cy="50" r="${r}"></circle>
      <circle class="ring-progress" cx="50" cy="50" r="${r}"
              stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"></circle>
    </svg>
    <div class="count">${count}</div>
  `;
  card.appendChild(ring);

  const side = el('div', 'weekly-bars-side');
  const goalLine = el('div', 'weekly-goal');
  goalLine.innerHTML = `Weekly goal: <strong>${WEEKLY_GOAL}</strong>`;
  side.appendChild(goalLine);

  const bars = el('div', 'day-bars');
  const DOW = ['M','T','W','T','F','S','S'];
  days.forEach((iso, i) => {
    const dow = i + 1;
    let classes = 'day-bar-col';
    if (active[i]) classes += ' active';
    if (iso === today) classes += ' today';
    if (dow > todayDow) classes += ' future';
    const col = el('div', classes);
    col.appendChild(el('div', 'day-bar'));
    col.appendChild(el('div', 'day-label', DOW[i]));
    bars.appendChild(col);
  });
  side.appendChild(bars);

  card.appendChild(side);
  root.appendChild(card);
}

function renderHistory() {
  const root = document.getElementById('tab-history');
  root.innerHTML = '';

  renderWeeklySummary(root);
  renderConnectedCard(root);

  const entries = allEntries();
  const hasTrends = doneWorkoutsOfType('run').length || doneWorkoutsOfType('swim').length;

  // Trend charts with a shared Weekly/Monthly switch (each self-skips if no data)
  if (hasTrends) renderTimeframeToggle(root);
  renderRunChartCard(root);
  renderSwimChartCard(root);

  // Backup utility — kept above the log so the log stays at the bottom
  renderBackupCard(root);

  // Entries list
  if (!entries.length) {
    const empty = el('div', 'card');
    empty.appendChild(el('div', 'muted', 'No entries yet. Complete a session in Today and hit "Mark session done".'));
    root.appendChild(empty);
    return;
  }

  // group by month
  const groups = {};
  entries.forEach(e => {
    const m = e.iso.slice(0, 7); // YYYY-MM
    if (!groups[m]) groups[m] = [];
    groups[m].push(e);
  });
  Object.keys(groups).sort((a,b) => b.localeCompare(a)).forEach(monthKey => {
    const monthDate = new Date(monthKey + '-01T12:00:00');
    const monthLabel = monthDate.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    const card = el('div', 'card');
    card.appendChild(el('h2', null, monthLabel));
    groups[monthKey].forEach(e => {
      const w = e.log.workout;
      const row = el('div', 'entry-row');
      row.addEventListener('click', () => jumpToToday(e.iso));

      const lhs = el('div', 'entry-lhs');
      const date = new Date(e.iso + 'T12:00:00');
      const dayShort = date.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric' });
      const effectiveType = (w.snapshot && w.snapshot.workoutType) || w.type;
      lhs.appendChild(el('div', 'entry-date', dayShort));
      lhs.appendChild(el('div', 'entry-type-pill', typeShort(effectiveType)));
      row.appendChild(lhs);

      const mid = el('div', 'entry-mid');
      mid.appendChild(el('div', 'entry-title', e.log.workout.snapshot?.workoutLabel || workoutLabel({ type: effectiveType, dayIdx: 0 })));
      const stats = entryStats(e);
      if (stats.length) mid.appendChild(el('div', 'entry-stats', stats.join(' · ')));
      if (w.notes) mid.appendChild(el('div', 'entry-note', '"' + w.notes.slice(0, 90) + (w.notes.length > 90 ? '…' : '') + '"'));
      row.appendChild(mid);

      const rhs = el('div', 'entry-rhs');
      if (w.completedAt) {
        const t = new Date(w.completedAt).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        rhs.appendChild(el('div', 'entry-time', t));
      }
      const del = el('button', 'icon-btn entry-del', '✕');
      del.title = 'Delete entry (clears the day\'s log)';
      del.addEventListener('click', (ev) => {
        ev.stopPropagation();
        if (confirm('Delete this entry? The day\'s log will be cleared.')) {
          delete state.logs[e.iso];
          saveState(); renderHistory(); toast('Entry deleted');
        }
      });
      rhs.appendChild(del);
      row.appendChild(rhs);

      card.appendChild(row);
    });
    root.appendChild(card);
  });
}

function typeShort(t) {
  return ({ gym: 'GYM', run: 'RUN', swim: 'SWIM', yoga: 'YOGA', rest: 'REST' })[t] || t.toUpperCase();
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

// ============================================================
//  CONNECTED DATA  (Strava / WHOOP sync from data.json)
// ============================================================

function fmtClock(sec) {
  sec = Math.round(sec || 0);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  return m + ':' + String(s).padStart(2, '0');
}
function stravaShort(sport) {
  return ({ Run: 'RUN', TrailRun: 'RUN', Swim: 'SWIM', WeightTraining: 'GYM', Workout: 'GYM',
            Ride: 'RIDE', VirtualRide: 'RIDE', Walk: 'WALK', Hike: 'HIKE', Yoga: 'YOGA' })[sport]
         || (sport || '').replace(/([a-z])([A-Z])/g, '$1 $2').toUpperCase().slice(0, 6);
}
function stravaPace(sport, mps) {
  if (!mps || mps <= 0) return null;
  if (sport === 'Run' || sport === 'TrailRun') return secondsToPace(Math.round(1000 / mps)) + ' /km';
  if (sport === 'Swim') return secondsToPace(Math.round(100 / mps)) + ' /100m';
  return null;
}
function stravaStats(a) {
  const out = [];
  if (a.distance_m > 0) out.push(fmtMeters(a.distance_m));
  if (a.moving_time_s) out.push(fmtClock(a.moving_time_s));
  const pace = stravaPace(a.sport_type, a.avg_speed_mps);
  if (pace) out.push(pace);
  if (a.calories) out.push(a.calories + ' kcal');
  if (a.relative_effort) out.push('effort ' + a.relative_effort);
  if (a.pr_count) out.push('🏅 ' + a.pr_count);
  return out;
}
function stravaRow(a) {
  const row = el('div', 'entry-row'); row.style.cursor = 'default';
  const d = new Date(a.start_local);
  const lhs = el('div', 'entry-lhs');
  lhs.appendChild(el('div', 'entry-date', isNaN(d) ? a.date : d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric' })));
  lhs.appendChild(el('div', 'entry-type-pill', stravaShort(a.sport_type)));
  row.appendChild(lhs);
  const mid = el('div', 'entry-mid');
  mid.appendChild(el('div', 'entry-title', a.name));
  const stats = stravaStats(a);
  if (stats.length) mid.appendChild(el('div', 'entry-stats', stats.join(' · ')));
  row.appendChild(mid);
  const rhs = el('div', 'entry-rhs');
  if (!isNaN(d)) rhs.appendChild(el('div', 'entry-time', d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })));
  row.appendChild(rhs);
  return row;
}
function renderRecovery(card, whoop) {
  const recovery = (whoop.recovery || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  const sleep    = (whoop.sleep    || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  const latest = recovery[recovery.length - 1];
  if (!latest) return false;
  const grid = el('div', 'recovery-grid');
  const stat = (num, lbl) => {
    const s = el('div', 'recovery-stat');
    s.appendChild(el('div', 'recovery-num', num));
    s.appendChild(el('div', 'recovery-lbl', lbl));
    grid.appendChild(s);
  };
  if (latest.recovery_score != null) stat(latest.recovery_score + '%', 'Recovery');
  if (latest.hrv_rmssd_ms  != null)  stat(Math.round(latest.hrv_rmssd_ms), 'HRV ms');
  if (latest.resting_hr    != null)  stat(latest.resting_hr, 'RHR');
  const latestSleep = sleep[sleep.length - 1];
  if (latestSleep && latestSleep.sleep_performance_pct != null) stat(latestSleep.sleep_performance_pct + '%', 'Sleep');
  card.appendChild(grid);
  return true;
}
function renderConnectedCard(root) {
  const sync = state.sync;
  if (!sync) return; // data.json not loaded yet (or unavailable)
  const card = el('div', 'card');

  const head = el('div', 'connected-head');
  head.appendChild(el('h2', null, 'Connected'));
  const d = sync.syncedAt ? new Date(sync.syncedAt) : null;
  if (d && !isNaN(d)) head.appendChild(el('div', 'muted',
    'Synced ' + d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
    ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })));
  card.appendChild(head);

  // WHOOP — recovery if connected, otherwise a gentle hint
  const whoop = sync.whoop || {};
  const shown = whoop.connected ? renderRecovery(card, whoop) : false;
  if (!shown) {
    const row = el('div', 'connected-row');
    row.appendChild(el('span', 'pill warn', 'WHOOP'));
    row.appendChild(el('span', 'muted', 'Not connected yet — finish app setup to see recovery & sleep here.'));
    card.appendChild(row);
  }

  // STRAVA — most recent activities
  const acts = (sync.strava && sync.strava.activities) || [];
  if (acts.length) {
    card.appendChild(el('h3', null, 'Recent activity · Strava'));
    acts.slice(0, 8).forEach(a => card.appendChild(stravaRow(a)));
  }

  root.appendChild(card);
}
async function loadSyncData() {
  try {
    const res = await fetch('./data.json', { cache: 'no-store' });
    if (!res.ok) return;
    state.sync = await res.json();
    const hist = document.getElementById('tab-history');
    if (hist && hist.style.display !== 'none') renderHistory();
  } catch (e) { /* offline or no synced data yet — ignore */ }
}

// ============================================================
//  INIT
// ============================================================
state.viewISO = todayISO();
renderToday();
loadSyncData();

// Register service worker for offline support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW registration failed', err));
  });
}
</script>
